name: screen readers

# Real screen readers, on the platforms they exist on. The Linux/Orca gate runs
# in design-system.yml; this covers the implementations Orca cannot speak for.
#
# NON-BLOCKING, deliberately — same as the Orca gate in design-system.yml, which
# is also continue-on-error there for the same class of reason: none of the three
# screen reader gates (NVDA, VoiceOver, Orca) currently blocks the branch, because
# none of them reliably reaches the page in CI yet. The assertions are therefore
# untested rather than wrong.
#
# VoiceOver: diagnosed. It reads Finder instead of the browser because starting
# VoiceOver mounts Guidepup's own preferences disk image, and macOS's default
# "open a Finder window when a disk mounts" behavior pops a window that wins the
# focus race — confirmed from a CI transcript reading literally "Finder
# guidepup-voiceover-preferences-macos-26 Volume". Fix attempt: disable that
# Finder default before the VoiceOver job runs (see the "Stop Finder..." step).
#
# Both: the harness hand-rolled "focus the page" (bringToFront, osascript
# activate, Control+Home). VoiceOver got as far as "You are currently in a
# main." and never read content; NVDA said only "blank". Switching to Guidepup's
# own navigateToWebContent() fixed VoiceOver: CI run 35868250903 passed the
# severity and heading tests, the first screen reader assertions ever to pass
# here. Its Tab tests then failed: neither Tab nor Option+Tab moved focus, each
# press re-announcing the h1, so the VoiceOver spec steps with its own cursor
# instead. NVDA still says only "blank" with the
# helper, so its cause is something else and remains undiagnosed.
#
# These jobs still RUN and still report failure in the UI; continue-on-error
# only stops them gating the branch.
#
# Remove continue-on-error once a transcript shows a screen reader reading this
# page's content. See docs/design-system/screen-reader-test-plan.md.

on:
  push:
    paths: ['design-system/**', 'scripts/**', 'tests/**', 'playwright.config.ts', 'package.json', 'package-lock.json', '.github/workflows/screen-reader.yml']
  pull_request:
    paths: ['design-system/**', 'scripts/**', 'tests/**', 'playwright.config.ts', 'package.json', 'package-lock.json', '.github/workflows/screen-reader.yml']
  workflow_dispatch:

jobs:
  nvda:
    name: NVDA (Windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: the accessibility gates drive Chromium over CDP using the
          # global WebSocket, which Node 20 does not have.
          node-version: '22'
          cache: npm
      - run: npm ci

      # Installs NVDA and enables the accessibility permissions it needs.
      - # Pinned to a commit: the action publishes no version tags.
        uses: guidepup/setup-action@acf1a64cc26292ebe0db6a28d1341bd1bae93c65

      # The setup action configures the OS; the screen reader's own assets are
      # a separate, per-project install. Without it VoiceOver and NVDA fail to
      # start with "Failed to mount Guidepup preferences".
      - name: Install Guidepup screen reader assets
        run: npx --yes @guidepup/setup install

      - run: npx playwright install --with-deps chromium
      - name: Build the preview from the real components
        run: node scripts/build-preview.mjs
      - name: NVDA
        run: npx playwright test --project=nvda

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nvda-transcript
          path: test-results/

  voiceover:
    name: VoiceOver (macOS)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: the accessibility gates drive Chromium over CDP using the
          # global WebSocket, which Node 20 does not have.
          node-version: '22'
          cache: npm
      - run: npm ci

      # Starting VoiceOver mounts a disk image (Guidepup's own preferences volume)
      # every time — VoiceOver.start() does this itself, not just the setup step
      # below. macOS's default "open a Finder window for a newly mounted disk"
      # then pops a window for it, which wins the focus race against the browser:
      # the transcript this was chasing was literally "Finder
      # guidepup-voiceover-preferences-macos-26 Volume", not the page.
      - name: Stop Finder from opening a window when a disk image mounts
        run: |
          defaults write com.apple.finder OpenWindowForNewRemovableDisk -bool false
          # cfprefsd caches preference values in memory; killing Finder alone can
          # relaunch it into a cache that still holds the old value. This run's
          # transcript still showed the Finder volume window after the first
          # attempt at this fix, which is consistent with a stale cache.
          killall cfprefsd || true
          killall Finder || true

      # Enables VoiceOver and grants the automation permissions it needs.
      - # Pinned to a commit: the action publishes no version tags.
        uses: guidepup/setup-action@acf1a64cc26292ebe0db6a28d1341bd1bae93c65

      - name: Install Guidepup screen reader assets
        run: npx --yes @guidepup/setup install

      - run: npx playwright install --with-deps webkit
      - name: Build the preview from the real components
        run: node scripts/build-preview.mjs
      - name: VoiceOver
        run: npx playwright test --project=voiceover

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: voiceover-transcript
          path: test-results/
