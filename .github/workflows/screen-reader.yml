name: screen readers

# Real screen readers, on the platforms they exist on. The Linux/Orca gate runs
# in design-system.yml; this covers the implementations Orca cannot speak for.
#
# VoiceOver BLOCKS. It passed all four assertions on two consecutive runs
# (35872345691, attempts 1 and 2) once the harness used Guidepup's own
# navigateToWebContent() and stepped the VO cursor instead of sending Tab, which
# never moved focus under VoiceOver.
#
# NVDA BLOCKS too. It said only "blank" until the browser ran headed
# (playwright.config.ts): headless Chromium has no window for NVDA to read.
# Once it could read, it found three bugs the other readers missed — Escape
# dismissed a finding, keys acted on the wrong card, and visually hidden text
# lost its spaces ("Apply fixfor…") — and passed all four assertions (run
# 36448190005). See docs/design-system/screen-reader-test-plan.md.

# Once per PR: a feature branch runs through pull_request only, so a push to a
# branch with an open PR no longer runs everything twice (push + pull_request).
# Pushes to main still run, so every merge is checked. workflow_dispatch runs a
# branch by hand before it has a PR.
#
# The reading specs (reading.*.spec.ts) read exported pages, so the export's
# own files are watched too: a change there changes what is said.
on:
  push:
    branches: [main]
    paths: ['design-system/**', 'scripts/**', 'tests/**', 'playwright.config.ts', 'package.json', 'package-lock.json', '.github/workflows/screen-reader.yml', 'app/_editor/exportHtml.ts', 'app/_editor/editorSchema.ts', 'app/_editor/tableHeaders.ts', 'docs/audit/clerk-walkthrough-2026-10/agenda-export.html']
  pull_request:
    paths: ['design-system/**', 'scripts/**', 'tests/**', 'playwright.config.ts', 'package.json', 'package-lock.json', '.github/workflows/screen-reader.yml', 'app/_editor/exportHtml.ts', 'app/_editor/editorSchema.ts', 'app/_editor/tableHeaders.ts', 'docs/audit/clerk-walkthrough-2026-10/agenda-export.html']
  workflow_dispatch:

# The screen readers' setup CLI, pinned. Unpinned, npx took each new release
# unannounced. Bump it on purpose, in a PR of its own, and watch both jobs.
# Both jobs install assets with it; the VoiceOver job also runs its macOS
# setup. (NVDA's setup-action, below, bundles its own copy, 0.23.0.)
#
# 0.29.2 (2026-10-10) changed how macOS permissions are written: it overwrites
# existing rows where 0.29.1 ignored them. The VoiceOver setup's retry depends
# on that (see the "Guidepup setup" step). Apart from that, 0.29.2 adds command
# timeouts; its download code is the same as 0.29.1's.
env:
  GUIDEPUP_SETUP: '@guidepup/setup@0.29.2'

jobs:
  nvda:
    name: NVDA (Windows)
    runs-on: windows-latest
    # The reading specs step through two pages a line at a time.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: the accessibility gates drive Chromium over CDP using the
          # global WebSocket, which Node 20 does not have.
          node-version: '22'
          cache: npm
      - run: npm ci

      # Installs NVDA and enables the accessibility permissions it needs.
      - # Pinned to a commit: the action publishes no version tags.
        uses: guidepup/setup-action@acf1a64cc26292ebe0db6a28d1341bd1bae93c65

      # The setup action configures the OS; the screen reader's own assets are
      # a separate, per-project install. Without it VoiceOver and NVDA fail to
      # start with "Failed to mount Guidepup preferences".
      #
      # The download from GitHub releases can fail on its own (run 38249783192,
      # 2026-10-12: VoiceOver's preferences image, fine on a re-run), so one
      # retry. On failure the installer's logger then crashes on Node 22
      # (Error.isError): the real error is the "[!] Error" line above the TypeError.
      - name: Install Guidepup screen reader assets
        shell: bash
        run: |
          npx --yes "$GUIDEPUP_SETUP" install || {
            echo "::warning::Guidepup's asset install failed; retrying once."
            sleep 15
            npx --yes "$GUIDEPUP_SETUP" install
          }

      - run: npx playwright install --with-deps chromium
      - name: Build the preview from the real components
        run: node scripts/build-preview.mjs
      - name: NVDA
        run: npx playwright test --project=nvda

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nvda-transcript
          path: test-results/

  voiceover:
    name: VoiceOver (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: the accessibility gates drive Chromium over CDP using the
          # global WebSocket, which Node 20 does not have.
          node-version: '22'
          cache: npm
      - run: npm ci

      # Starting VoiceOver mounts a disk image (Guidepup's own preferences volume)
      # every time — VoiceOver.start() does this itself, not just the setup step
      # below. macOS's default "open a Finder window for a newly mounted disk"
      # then pops a window for it, which wins the focus race against the browser:
      # the transcript this was chasing was literally "Finder
      # guidepup-voiceover-preferences-macos-26 Volume", not the page.
      - name: Stop Finder from opening a window when a disk image mounts
        run: |
          defaults write com.apple.finder OpenWindowForNewRemovableDisk -bool false
          # cfprefsd caches preference values in memory; killing Finder alone can
          # relaunch it into a cache that still holds the old value. This run's
          # transcript still showed the Finder volume window after the first
          # attempt at this fix, which is consistent with a stale cache.
          killall cfprefsd || true
          killall Finder || true

      # Enables VoiceOver and grants the automation permissions it needs.
      #
      # It intermittently fails before any test runs: it writes the automation
      # permissions into TCC.db, then at once drives Control Center to turn on
      # Do Not Disturb, and macOS refuses — "Not authorized to send Apple events
      # to System Events (-2700)". Upstream already retries that script 5 times
      # (guidepup/setup enableDoNotDisturb.ts, about 105s in all) and it still
      # fails. --ci always turns on Do Not Disturb; there is no option to skip it.
      #
      # Once it fails on a runner, it stays failed there. Under setup-action
      # (which bundles 0.23.0), a retry 30s later failed all 5 times it ran
      # (runs 37538131712, 38269149658, 38305479314, 38436609521, 38450046081;
      # 2026-10-06 to 10-13), while re-runs on fresh runners passed. 0.23.0
      # and 0.29.1 write the permissions with INSERT OR IGNORE, so a refusal
      # macOS has already recorded in TCC.db stays put; that is the likely
      # reason. 0.29.2 overwrites the existing rows, so its retry rewrites the
      # grant. setup-action is deprecated upstream with no newer code, so this
      # runs the pinned CLI directly, as upstream now says to.
      #
      # On failure the CLI's logger can crash on Node 22 (Error.isError); the
      # real error is the "[!] Error" line above the TypeError.
      #
      # Ceiling: one retry, on 0.29.2. Upgrade trigger: the retry fails again
      # on 0.29.2 or later, or upstream adds a way to skip Do Not Disturb.
      - name: Guidepup setup
        id: guidepup
        continue-on-error: true
        run: npx --yes "$GUIDEPUP_SETUP" setup --ci
      - name: Wait before retrying Guidepup setup
        if: steps.guidepup.outcome == 'failure'
        run: |
          echo "::warning::Guidepup setup failed on its first attempt (the Do Not Disturb permission race); retrying once."
          sleep 30
      - name: Guidepup setup (retry)
        if: steps.guidepup.outcome == 'failure'
        run: npx --yes "$GUIDEPUP_SETUP" setup --ci

      # As in the NVDA job: pinned, one retry.
      - name: Install Guidepup screen reader assets
        shell: bash
        run: |
          npx --yes "$GUIDEPUP_SETUP" install || {
            echo "::warning::Guidepup's asset install failed; retrying once."
            sleep 15
            npx --yes "$GUIDEPUP_SETUP" install
          }

      - run: npx playwright install --with-deps webkit
      - name: Build the preview from the real components
        run: node scripts/build-preview.mjs
      - name: VoiceOver
        run: npx playwright test --project=voiceover

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: voiceover-transcript
          path: test-results/
