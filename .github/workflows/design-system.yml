name: design system

on:
  push:
    paths: ['design-system/**', 'scripts/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/design-system.yml']
  pull_request:
    paths: ['design-system/**', 'scripts/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/design-system.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: the accessibility gates drive Chromium over CDP using the
          # global WebSocket, which Node 20 does not have.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck the components
        run: npx tsc --noEmit

      - name: Test the verifier
        run: node scripts/test-verifier.mjs

      - name: Verify design tokens
        run: node scripts/verify-tokens.mjs --verbose

      - name: Check generated files are up to date
        run: |
          node scripts/build-tokens.mjs
          node scripts/build-preview.mjs
          if ! git diff --quiet -- design-system/; then
            echo "::error::Generated files are stale. Run 'npm run tokens:build && npm run preview:build' and commit."
            git diff --stat -- design-system/
            exit 1
          fi

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: the accessibility gates drive Chromium over CDP using the
          # global WebSocket, which Node 20 does not have.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium for the accessibility gate
        run: npx --yes playwright@1.49.0 install --with-deps chromium

      - name: Build the preview from the real components
        run: node scripts/build-preview.mjs

      - name: Accessibility gate (axe-core + accessibility tree + keyboard)
        run: node scripts/verify-a11y.mjs --verbose

  # Split out and NON-BLOCKING. The Orca gate passes reliably on a developer
  # machine (7 checks) but on a runner Orca attaches and then reads nothing —
  # its whole transcript is "Screen reader on." and the browser frame. That is an
  # environment problem, not a finding about the components, so it must not gate
  # the branch while it is unreliable.
  #
  # It still RUNS and still reports failure, and it can no longer skip silently:
  # verify-orca.mjs treats a skip as a failure when CI is set. Remove
  # continue-on-error once a CI transcript shows Orca reading the page content.
  orca:
    name: Orca screen reader (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx --yes playwright@1.49.0 install --with-deps chromium
      - run: node scripts/build-preview.mjs

      - name: Install Orca and the AT-SPI stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            orca at-spi2-core xvfb openbox speech-dispatcher speech-dispatcher-espeak-ng \
            espeak-ng dbus-x11 python3-gi gir1.2-atspi-2.0 xdotool x11-utils
          # speech-dispatcher blocks forever without an audio device.
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' | sudo tee /etc/asound.conf

      - name: Orca screen reader gate
        run: |
          ./scripts/a11y-stack.sh &
          for i in $(seq 1 60); do
            grep -q READY /tmp/a11y-status.txt 2>/dev/null && break
            sleep 2
          done
          grep -q READY /tmp/a11y-status.txt || { echo "::error::AT-SPI stack never came up"; cat /tmp/a11y-status.txt 2>/dev/null; exit 1; }
          set -a && . /tmp/a11y-env.sh && set +a
          node scripts/verify-orca.mjs --verbose

      # Runs whether the gate passed or failed. The gate established that Orca
      # is handed none of the keys sent to it; this is the comparison against a
      # working local display, recorded in the test plan, that says whether the
      # display or the package versions differ at all.
      - name: X display and AT-SPI environment
        if: always()
        run: |
          set -a && . /tmp/a11y-env.sh && set +a
          echo "== os =="
          grep -E '^VERSION=|^ID=' /etc/os-release
          echo "== package versions =="
          dpkg -l orca at-spi2-core xvfb 2>/dev/null | awk '/^ii/{print $2": "$3}'
          echo "== at-spi2-registryd =="
          echo "running: $(pgrep -c at-spi2-registr || echo 0)"
          echo "== X extensions =="
          xdpyinfo -queryExtensions | grep 'opcode:' | sed 's/^ *//' | sort
          echo "count: $(xdpyinfo -queryExtensions | grep -c 'opcode:')"
          echo "== orca keyboard grabs =="
          echo "GRABS ADDED: $(grep -a -c 'GRABS ADDED' /tmp/orca-gate-speech.log || echo 0)"
          echo "listeners registered: $(grep -a -c 'registering listener for' /tmp/orca-gate-speech.log || echo 0)"

      # The counts above are markers I chose in advance, which is how the last
      # two wrong conclusions in this investigation were reached. Orca's debug
      # log is the primary source; upload it and read it rather than grepping
      # for what I already expect to find.
      - name: Upload Orca's debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-debug-log
          path: /tmp/orca-gate-speech.log
          if-no-files-found: warn
