name: design system

on:
  push:
    paths: ['design-system/**', 'app/**', 'next.config.ts', 'scripts/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/design-system.yml']
  pull_request:
    paths: ['design-system/**', 'app/**', 'next.config.ts', 'scripts/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/design-system.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: the accessibility gates drive Chromium over CDP using the
          # global WebSocket, which Node 20 does not have.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck the components
        run: npx tsc --noEmit

      - name: Test the verifier
        run: node scripts/test-verifier.mjs

      - name: Verify design tokens
        run: node scripts/verify-tokens.mjs --verbose

      - name: Check generated files are up to date
        run: |
          node scripts/build-tokens.mjs
          node scripts/build-preview.mjs
          if ! git diff --quiet -- design-system/; then
            echo "::error::Generated files are stale. Run 'npm run tokens:build && npm run preview:build' and commit."
            git diff --stat -- design-system/
            exit 1
          fi

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: the accessibility gates drive Chromium over CDP using the
          # global WebSocket, which Node 20 does not have.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium for the accessibility gate
        run: npx --yes playwright@1.49.0 install --with-deps chromium

      - name: Build the preview from the real components
        run: node scripts/build-preview.mjs

      - name: Accessibility gate (axe-core + accessibility tree + keyboard)
        run: node scripts/verify-a11y.mjs --verbose

      - name: App accessibility gate (Dashboard + Editor, builds the Next app)
        run: node scripts/verify-a11y-app.mjs --verbose

  # Blocking since 2026-09-23. It was non-blocking while a runner transcript read
  # only "Screen reader on." and the browser frame: Orca's main thread was stuck
  # forever waiting on speech-dispatcher's reply to a cancel, so it processed no
  # keys or focus changes. Pinning speech-dispatcher to ALSA and espeak-ng (below)
  # fixed it. verify-orca.mjs also treats a skip as a failure when CI is set.
  orca:
    name: Orca screen reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx --yes playwright@1.49.0 install --with-deps chromium
      - run: node scripts/build-preview.mjs

      - name: Install Orca and the AT-SPI stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            orca at-spi2-core xvfb speech-dispatcher speech-dispatcher-espeak-ng \
            espeak-ng dbus-x11 python3-gi gir1.2-atspi-2.0 xdotool
          # speech-dispatcher blocks forever without an audio device.
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' | sudo tee /etc/asound.conf
          # ...and only if speech-dispatcher actually uses ALSA. Pin the output
          # method and the one voice module the gate needs; a hung module left
          # Orca blocked forever on speech-dispatcher's reply to a cancel.
          printf 'AudioOutputMethod "alsa"\nAddModule "espeak-ng" "sd_espeak-ng" "espeak-ng.conf"\nDefaultModule espeak-ng\nLogDir "/tmp/speechd"\n' \
            | sudo tee -a /etc/speech-dispatcher/speechd.conf

      - name: Orca screen reader gate
        run: |
          ./scripts/a11y-stack.sh &
          for i in $(seq 1 60); do
            grep -q READY /tmp/a11y-status.txt 2>/dev/null && break
            sleep 2
          done
          grep -q READY /tmp/a11y-status.txt || { echo "::error::AT-SPI stack never came up"; cat /tmp/a11y-status.txt 2>/dev/null; exit 1; }
          set -a && . /tmp/a11y-env.sh && set +a
          node scripts/verify-orca.mjs --verbose

      # Orca's --debug log records every AT-SPI event, focus change and object
      # role, not just speech; it is the evidence for why a run read nothing.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: orca-debug
          path: |
            /tmp/orca-gate-speech.log
            /tmp/atspi-bus.log
            /tmp/atspi-reg.log
            /tmp/xvfb.log
            /tmp/speechd/
